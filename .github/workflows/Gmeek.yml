name: build Gmeek

on:
  workflow_dispatch:
    inputs:
      force_full:
        description: Rebuild every article
        type: boolean
        default: false
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, deleted]
  push:
    branches: [main]
    paths:
      - config.json
      - templates/**
      - static/**
      - scripts/**
      - .github/workflows/Gmeek.yml

# Every build reconciles the complete issue snapshot. Replaced pending runs
# therefore cannot drop an edit, and an older deploy cannot overtake a newer one.
concurrency:
  group: gmeek-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Generate blog
    if: github.event_name == 'push' || github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout blog
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Resolve Gmeek version
        id: engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("config.json"))["GMEEK_VERSION"])')
          if [ "$version" = last ]; then
            version=$(gh api repos/Meekdai/Gmeek/tags --jq '.[0].name')
          fi
          echo "ref=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout Gmeek
        uses: actions/checkout@v7
        with:
          repository: Meekdai/Gmeek
          ref: ${{ steps.engine.outputs.ref }}
          path: .gmeek-engine
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python with dependency cache
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .gmeek-engine/requirements.txt

      - name: Install dependencies
        run: pip install -r .gmeek-engine/requirements.txt

      - name: Restore generated pages
        uses: actions/cache/restore@v6
        with:
          path: .gmeek-state
          key: gmeek-state-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gmeek-state-v1-${{ github.ref_name }}-

      - name: Validate incremental build rules
        run: python -m unittest discover -s scripts -v

      - name: Generate changed articles
        env:
          GH_TOKEN: ${{ github.token }}
          GMEEK_ENGINE: ${{ github.workspace }}/.gmeek-engine
          FORCE_FULL: ${{ inputs.force_full || false }}
        run: python scripts/build_blog.py

      - name: Save generated pages
        uses: actions/cache/save@v6
        with:
          path: .gmeek-state
          key: gmeek-state-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .gmeek-state/docs

  deploy:
    name: Deploy blog
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
