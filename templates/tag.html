{% extends 'base.html' %}
{% block head %}<title>分类与搜索 · {{ blogBase['title']|e }}</title><meta name="description" content="{{ blogBase['displayTitle']|e }} 的文章分类与搜索">{% endblock %}
{% block content %}
<div data-page="explore">
  <header class="page-intro"><h1 id="explore-title">分类与搜索</h1><p id="explore-subtitle">从一个话题，读起。</p></header>
  <section class="profile" id="profile" hidden><img src="{{ blogBase['avatarUrl']|e }}" alt="{{ blogBase['displayTitle']|e }}"><div><h2>{{ blogBase['displayTitle']|e }}</h2><p>{{ blogBase['subTitle']|e }}</p><a href="https://github.com/{{ blogBase.get('repoName','Geekiter/geekiter.github.io').split('/')[0] }}">GitHub {{ icon('arrow') }}</a></div></section>
  <div id="explore-controls"><form class="search-form" action="{{ blogBase['homeUrl'] }}/tag.html" role="search">{{ icon('search') }}<input type="search" name="q" placeholder="搜索文章、关键词或分类" aria-label="搜索文章"><button type="submit">搜索</button></form><nav class="category-tabs" id="category-tabs" aria-label="文章分类"></nav></div>
  <div class="article-grid" id="article-grid" aria-live="polite"></div>
</div>
{% endblock %}
